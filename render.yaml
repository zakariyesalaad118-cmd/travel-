services:
  - type: web
    name: som-trevel
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - {key: NODE_ENV, value: production}
      - {key: JWT_SECRET, generateValue: true}
      - {key: MONGODB_URI, sync: false}
      - {key: ADMIN_EMAIL, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: APP_URL, sync: false}
      - {key: DEMO_ENABLED, value: "true"}
      - {key: RESEND_API_KEY, sync: false}
      - {key: MAIL_FROM, sync: false}
      - {key: STRIPE_SECRET_KEY, sync: false}
      - {key: STRIPE_WEBHOOK_SECRET, sync: false}
